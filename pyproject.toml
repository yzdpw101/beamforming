[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antopt"
version = "0.2.0"
description = "阵列天线波束成形优化库 — 低副瓣 / 零陷 / 差波束"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "sphinx>=5.0", "jupyter>=1.0"]
surrogate = ["scikit-learn>=1.3"]
space-mapping = ["cma>=3"]

[tool.setuptools.packages.find]
include = ["antopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
